<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>警察抓小偷 · 游戏界面设计稿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   设计令牌 —— “积木小镇”卡通体系
   ============================================================ */
:root {
    --sky:      #6EC6EE;   /* 天空蓝：页面底色 */
    --sky-deep: #3FA8DE;   /* 天空深处 */
    --ink:      #22315B;   /* 描边藏青：所有轮廓与文字 */
    --cream:    #FFF6E3;   /* 奶油格：棋盘格与卡片 */
    --cream-dk: #F3E3C2;   /* 奶油格暗面 */
    --police:   #2E7CD6;   /* 警蓝 */
    --police-d: #1C5BAC;   /* 警蓝暗面 */
    --thief:    #F04E45;   /* 小偷红 */
    --thief-d:  #C9332B;
    --sun:      #FFC93C;   /* 星星黄：主按钮与奖励 */
    --sun-d:    #E8A91C;
    --cell: min(64px, calc((100vw - 64px) / 6));   /* 与游戏一致的 64px 网格，窄屏自动收缩 */
    --radius-cell: 14px;
    --line: 4px;           /* 卡通粗描边 */
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }

body {
    font-family: "Baloo 2", "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
        radial-gradient(circle at 15% 12%, rgba(255,255,255,.55) 0 34px, transparent 36px),
        radial-gradient(circle at 23% 12%, rgba(255,255,255,.55) 0 26px, transparent 28px),
        radial-gradient(circle at 80% 22%, rgba(255,255,255,.45) 0 30px, transparent 32px),
        radial-gradient(circle at 88% 22%, rgba(255,255,255,.45) 0 22px, transparent 24px),
        linear-gradient(180deg, var(--sky) 0%, var(--sky-deep) 78%, #2E8FC4 100%);
    color: var(--ink);
    overflow: hidden;
    display: flex;
    justify-content: center;
}

/* 远景城市剪影，垫底氛围 */
.skyline {
    position: fixed; left: 0; right: 0; bottom: 0; height: 132px;
    background:
        linear-gradient(0deg, rgba(34,49,91,.28), rgba(34,49,91,.28));
    clip-path: polygon(0 100%, 0 55%, 6% 55%, 6% 30%, 13% 30%, 13% 62%, 20% 62%, 20% 18%, 27% 18%, 27% 48%, 35% 48%, 35% 70%, 43% 70%, 43% 35%, 51% 35%, 51% 58%, 60% 58%, 60% 22%, 68% 22%, 68% 52%, 76% 52%, 76% 68%, 84% 68%, 84% 38%, 92% 38%, 92% 60%, 100% 60%, 100% 100%);
    pointer-events: none;
}

/* 舞台：移动端竖屏优先，桌面端限宽居中 */
.stage {
    position: relative;
    width: min(430px, 100vw);
    height: 100dvh;
    max-height: 932px;
    display: flex;
    flex-direction: column;
    padding: 12px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 1;
}

/* ============================================================
   顶部：警徽标题 + 警灯签名条 + 操作按钮
   ============================================================ */
.hud {
    display: flex;
    align-items: center;
    gap: 10px;
}

.badge-level {
    display: flex; align-items: center; gap: 8px;
    background: var(--cream);
    border: var(--line) solid var(--ink);
    border-radius: 999px;
    padding: 6px 14px 6px 8px;
    box-shadow: 0 4px 0 rgba(34,49,91,.35);
    font-family: "ZCOOL KuaiLe", sans-serif;
    font-size: 17px;
    flex-shrink: 0;
}
.badge-level .star {
    width: 30px; height: 30px; flex-shrink: 0;
    background: var(--sun);
    border: 3px solid var(--ink);
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 14px; font-family: "Baloo 2"; font-weight: 800;
}

/* 签名元素：红蓝交替的警灯条 */
.siren {
    flex: 1; height: 14px; min-width: 60px;
    border: 3px solid var(--ink);
    border-radius: 999px;
    background: linear-gradient(90deg, var(--thief) 0 50%, var(--police) 50% 100%);
    background-size: 200% 100%;
    animation: siren 1.1s steps(1) infinite;
    box-shadow: 0 3px 0 rgba(34,49,91,.3);
}
@keyframes siren {
    0%, 49%   { background-position: 0 0; }
    50%, 100% { background-position: 100% 0; }
}

.btn-round {
    width: 46px; height: 46px; flex-shrink: 0;
    border: var(--line) solid var(--ink);
    border-radius: 16px;
    background: var(--cream);
    box-shadow: 0 4px 0 rgba(34,49,91,.4);
    display: grid; place-items: center;
    cursor: pointer;
    transition: transform .08s, box-shadow .08s;
}
.btn-round:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(34,49,91,.4); }
.btn-round svg { width: 22px; height: 22px; }
.btn-round:disabled { opacity: .45; pointer-events: none; }

/* 状态行：步数 + 目标提示 */
.status-row {
    display: flex; align-items: center; justify-content: space-between;
    margin: 12px 2px 10px;
    font-size: 14px;
}
.status-row .moves {
    background: rgba(34,49,91,.55);
    color: #fff;
    border-radius: 999px;
    padding: 4px 14px;
    font-weight: 800; letter-spacing: .5px;
}
.status-row .moves b { color: var(--sun); font-size: 16px; }
.status-row .goal {
    color: #fff; font-weight: 700;
    text-shadow: 0 2px 0 rgba(34,49,91,.35);
}

/* ============================================================
   棋盘：奶油格街区，小偷藏在中央
   ============================================================ */
.board-wrap {
    position: relative;
    align-self: center;
    padding: 10px;
    background: var(--ink);
    border-radius: 26px;
    box-shadow: 0 10px 0 rgba(34,49,91,.45), 0 18px 32px rgba(20,35,70,.35);
}
.board {
    position: relative;
    width: calc(var(--cell) * 6);
    height: calc(var(--cell) * 6);
    border-radius: 18px;
    overflow: hidden;
    background: #E2D2AE;   /* 格缝：路面色，与奶油格拉开对比 */
}
.cell {
    position: absolute;
    width: var(--cell); height: var(--cell);
    padding: 3px;
}
.cell::before {
    content: "";
    display: block; width: 100%; height: 100%;
    background: #FFFAEE;
    border-radius: var(--radius-cell);
    box-shadow: inset 0 -4px 0 var(--cream-dk);
}
/* 棋盘坐标微调样式：道路斑马线装饰（四角） */
.cell.corner::after {
    content: "";
    position: absolute; inset: 10px;
    border-radius: 8px;
    background: repeating-linear-gradient(45deg, transparent 0 6px, rgba(34,49,91,.06) 6px 12px);
    pointer-events: none;
}

/* 小偷：会东张西望的通缉犯（签名动效） */
.thief {
    position: absolute;
    width: var(--cell); height: var(--cell);
    display: grid; place-items: center;
    z-index: 2;
    pointer-events: none;
}
.thief svg { width: 52px; height: 52px; overflow: visible; }
.thief .eyes { animation: peek 3.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
@keyframes peek {
    0%, 18%   { transform: translateX(0); }
    25%, 42%  { transform: translateX(-2.5px); }
    52%, 68%  { transform: translateX(2.5px); }
    78%, 100% { transform: translateX(0); }
}
.thief.caught .eyes { animation: none; }
.thief.caught { animation: busted .5s ease; }
@keyframes busted {
    0% { transform: scale(1); } 40% { transform: scale(1.25) rotate(-8deg); } 100% { transform: scale(1); }
}

/* ============================================================
   棋子：蓝警积木，警徽格标记警察站位
   ============================================================ */
.piece {
    position: absolute;
    touch-action: none;
    cursor: grab;
    z-index: 5;
    transition: filter .15s;
}
.piece .pcell {
    position: absolute;
    width: var(--cell); height: var(--cell);
    padding: 5px;
}
.piece .pcell::before {
    content: "";
    display: block; width: 100%; height: 100%;
    background: linear-gradient(180deg, #5B9BEB 0%, var(--police) 55%, var(--police-d) 100%);
    border: 3px solid var(--ink);
    border-radius: var(--radius-cell);
    box-shadow: inset 0 3px 0 rgba(255,255,255,.45);
}
.piece .pcell.cop::after {
    content: "";
    position: absolute; inset: 9px;
    background: var(--sun) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="%2322315B" d="M12 1.8 14.6 8l6.4.3-5 4 1.7 6.2L12 14.9l-5.7 3.6L8 12.3l-5-4 6.4-.3z"/></svg>') center/70% no-repeat;
    border: 3px solid var(--ink);
    border-radius: 10px;
}
.piece.dragging {
    z-index: 50;
    cursor: grabbing;
    filter: drop-shadow(0 14px 14px rgba(20,35,70,.45));
}
.piece.dragging .pcell::before { background: linear-gradient(180deg, #74AEF5 0%, #3E8CE4 55%, var(--police-d) 100%); }
.piece.placed { cursor: pointer; }
.piece.shake { animation: shake .3s ease; }
@keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); } 75% { transform: translateX(6px); }
}

/* 放置落点预览 */
.ghost {
    position: absolute;
    width: var(--cell); height: var(--cell);
    padding: 5px; z-index: 3; pointer-events: none;
}
.ghost::before {
    content: ""; display: block; width: 100%; height: 100%;
    border-radius: var(--radius-cell);
    border: 3px dashed rgba(34,49,91,.55);
    background: rgba(255,255,255,.35);
}
.ghost.bad::before { border-color: var(--thief); background: rgba(240,78,69,.2); }

/* 棋盘与托盘之间的街景过渡带 */
.town {
    flex: 1;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    min-height: 40px;
    pointer-events: none;
}
.town svg { width: min(360px, 92%); height: auto; max-height: 100%; }

/* ============================================================
   底部托盘：待部署警力
   ============================================================ */
.tray {
    background: var(--cream);
    border: var(--line) solid var(--ink);
    border-radius: 24px;
    box-shadow: 0 8px 0 rgba(34,49,91,.4);
    padding: 10px 12px 12px;
}
.tray-label {
    display: flex; align-items: center; justify-content: space-between;
    font-family: "ZCOOL KuaiLe", sans-serif;
    font-size: 16px;
    margin: 0 4px 8px;
}
.tray-label .tip {
    font-family: "Baloo 2", "PingFang SC", sans-serif;
    font-size: 12px; font-weight: 700;
    color: #fff; background: var(--police);
    border-radius: 999px; padding: 3px 10px;
}
.tray-slots {
    display: flex; gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 4px 2px 6px;
}
.tray-slots::-webkit-scrollbar { display: none; }
.slot {
    flex-shrink: 0;
    width: 108px; height: 96px;
    border: 3px dashed rgba(34,49,91,.35);
    border-radius: 18px;
    display: grid; place-items: center;
    position: relative;
}
.slot.empty::after {
    content: "已上岗";
    font-size: 12px; font-weight: 800;
    color: rgba(34,49,91,.4);
}

/* ============================================================
   弹层：开场 & 胜利
   ============================================================ */
.overlay {
    position: fixed; inset: 0; z-index: 100;
    display: grid; place-items: center;
    background: rgba(20,35,70,.55);
    backdrop-filter: blur(3px);
    opacity: 1; transition: opacity .25s;
}
.overlay.hidden { opacity: 0; pointer-events: none; }
.card {
    width: min(340px, 86vw);
    background: var(--cream);
    border: 5px solid var(--ink);
    border-radius: 28px;
    box-shadow: 0 12px 0 rgba(34,49,91,.5);
    padding: 26px 24px 24px;
    text-align: center;
    transform: translateY(0);
    transition: transform .25s;
}
.overlay.hidden .card { transform: translateY(24px); }

/* 通缉令风格标题卡 */
.wanted {
    display: inline-block;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 14px;
    padding: 10px 18px 12px;
    transform: rotate(-2.5deg);
    box-shadow: 0 5px 0 rgba(34,49,91,.25);
    margin-bottom: 14px;
}
.wanted small {
    display: block;
    font-family: "Baloo 2"; font-weight: 800;
    letter-spacing: 4px; font-size: 11px;
    color: var(--thief);
}
.wanted h1 {
    font-family: "ZCOOL KuaiLe", sans-serif;
    font-size: 34px; letter-spacing: 2px;
    line-height: 1.1;
}
.card p { font-size: 14px; font-weight: 700; color: rgba(34,49,91,.75); margin-bottom: 18px; line-height: 1.6; }

.btn-primary {
    display: inline-block;
    font-family: "ZCOOL KuaiLe", sans-serif;
    font-size: 20px; letter-spacing: 3px;
    color: var(--ink);
    background: linear-gradient(180deg, #FFD964, var(--sun));
    border: var(--line) solid var(--ink);
    border-radius: 18px;
    padding: 12px 34px;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--sun-d), 0 10px 16px rgba(20,35,70,.25);
    transition: transform .08s, box-shadow .08s;
}
.btn-primary:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--sun-d); }

.win-stars { font-size: 34px; letter-spacing: 8px; margin-bottom: 6px; }
.win-stars .dim { opacity: .25; filter: grayscale(1); }
.card h2 { font-family: "ZCOOL KuaiLe"; font-size: 30px; margin-bottom: 6px; }

/* 操作提示气泡（首次进入） */
.coach {
    position: absolute; z-index: 60;
    background: var(--ink); color: #fff;
    font-size: 13px; font-weight: 700;
    border-radius: 14px; padding: 8px 14px;
    box-shadow: 0 6px 14px rgba(20,35,70,.4);
    pointer-events: none;
    opacity: 0; transition: opacity .3s;
    white-space: nowrap;
}
.coach.show { opacity: 1; }
.coach::after {
    content: ""; position: absolute; left: 50%; bottom: -7px;
    transform: translateX(-50%);
    border: 8px solid transparent; border-top-color: var(--ink); border-bottom: 0;
}

@media (max-height: 700px) {
    :root { --cell: 54px; }
    .status-row { margin: 8px 2px 6px; }
}

@media (prefers-reduced-motion: reduce) {
    .siren, .thief .eyes { animation: none; }
    * { transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="skyline"></div>

<div class="stage" id="stage">
    <!-- 顶部 HUD -->
    <header class="hud">
        <div class="badge-level"><span class="star">1</span>第 1 关</div>
        <div class="siren" aria-hidden="true"></div>
        <button class="btn-round" id="btnUndo" title="撤销上一步" aria-label="撤销上一步" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="#22315B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
        </button>
        <button class="btn-round" id="btnRestart" title="重新开始" aria-label="重新开始">
            <svg viewBox="0 0 24 24" fill="none" stroke="#22315B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        </button>
    </header>

    <div class="status-row">
        <span class="moves">已部署 <b id="moveCount">0</b> / 6 队警力</span>
        <span class="goal">围住小偷，别让他跑了！</span>
    </div>

    <!-- 棋盘 -->
    <div class="board-wrap">
        <div class="board" id="board"></div>
        <div class="coach" id="coach">点一下棋子可以转向</div>
    </div>

    <!-- 棋盘与托盘之间的街景过渡带（纯装饰） -->
    <div class="town" aria-hidden="true">
        <svg viewBox="0 0 360 74" preserveAspectRatio="xMidYMax meet">
            <!-- 小房子 -->
            <g stroke="#22315B" stroke-width="4" stroke-linejoin="round">
                <rect x="14" y="34" width="46" height="38" rx="6" fill="#FFF6E3"/>
                <path d="M8 38 37 14l29 24z" fill="#F04E45"/>
                <rect x="30" y="48" width="14" height="24" rx="3" fill="#2E7CD6"/>
                <!-- 树 -->
                <circle cx="92" cy="34" r="16" fill="#8FD14F"/>
                <circle cx="108" cy="40" r="12" fill="#8FD14F"/>
                <rect x="94" y="46" width="10" height="26" rx="4" fill="#B06A3B"/>
                <!-- 巡逻车 -->
                <g>
                    <rect x="150" y="36" width="72" height="30" rx="10" fill="#FFF6E3"/>
                    <path d="M158 36 q4 -16 28 -16 t28 16z" fill="#2E7CD6"/>
                    <rect x="176" y="18" width="20" height="10" rx="4" fill="#F04E45">
                        <animate attributeName="fill" values="#F04E45;#2E7CD6;#F04E45" dur="1.1s" repeatCount="indefinite"/>
                    </rect>
                    <rect x="158" y="46" width="56" height="10" rx="5" fill="#2E7CD6"/>
                    <circle cx="168" cy="68" r="9" fill="#22315B"/>
                    <circle cx="204" cy="68" r="9" fill="#22315B"/>
                </g>
                <!-- 远处小房子 -->
                <rect x="266" y="42" width="38" height="30" rx="6" fill="#FFE9B8"/>
                <path d="M262 44 285 26l23 18z" fill="#E8A91C"/>
                <rect x="278" y="52" width="12" height="20" rx="3" fill="#B06A3B"/>
                <!-- 树2 -->
                <circle cx="330" cy="40" r="14" fill="#8FD14F"/>
                <rect x="326" y="50" width="9" height="22" rx="4" fill="#B06A3B"/>
            </g>
        </svg>
    </div>

    <!-- 棋子托盘 -->
    <div class="tray">
        <div class="tray-label">
            <span>🚓 待部署警力</span>
            <span class="tip">拖到街区 · 点按转向</span>
        </div>
        <div class="tray-slots" id="traySlots"></div>
    </div>
</div>

<!-- 开场弹层 -->
<div class="overlay" id="startOverlay">
    <div class="card">
        <div class="wanted">
            <small>WANTED · 通缉令</small>
            <h1>警察抓小偷</h1>
        </div>
        <p>小偷躲进了积木小镇！<br>把警察小队拖进街区、点按转向，<br>封住他上下左右所有去路就算抓到。</p>
        <button class="btn-primary" id="btnStart">开始巡逻</button>
    </div>
</div>

<!-- 胜利弹层 -->
<div class="overlay hidden" id="winOverlay">
    <div class="card">
        <div class="win-stars" id="winStars">⭐⭐⭐</div>
        <h2>抓住啦！</h2>
        <p id="winText">小偷插翅难逃，小镇恢复平静。</p>
        <button class="btn-primary" id="btnAgain">再来一局</button>
    </div>
</div>

<script>
/* ============================================================
   可玩原型：数据与 game2/Pieces.ts 保持一致
   6×6 棋盘，64px 格，小偷在 (1,1)，警察棋子含站位格
   ============================================================ */
/* 实测棋盘宽度反推格边长（CSS 侧 var(--cell) 自行解析，JS 不能用 getComputedStyle 取 min()） */
const CELL = () => board.clientWidth / GRID;
const GRID = 6;                       // 坐标范围 -3..2，与 BoardGrid.isValidCoord 一致
const HALF = GRID / 2;
const THIEF = { x: 1, y: 1 };

// 警察棋子目录（形状取自 Pieces.ts 的 PoliceUI-001..006）
const PIECES = [
    { id: 'P1', cells: [{x:0,y:1},{x:0,y:0},{x:-1,y:0},{x:1,y:0}], origin: 1, cop: 0 }, // T形
    { id: 'P2', cells: [{x:0,y:1},{x:0,y:0},{x:1,y:0}],             origin: 1, cop: 1 }, // 小L
    { id: 'P3', cells: [{x:-1,y:0},{x:0,y:0},{x:1,y:0}],            origin: 1, cop: 1 }, // 横条
    { id: 'P4', cells: [{x:0,y:1},{x:0,y:0},{x:1,y:0}],             origin: 1, cop: 0 }, // 小L·变体
    { id: 'P5', cells: [{x:0,y:2},{x:0,y:1},{x:0,y:0},{x:1,y:0}],   origin: 2, cop: 0 }, // 大L
    { id: 'P6', cells: [{x:0,y:2},{x:0,y:1},{x:0,y:0},{x:-1,y:0}],  origin: 2, cop: 2 }, // 反L
];

const board = document.getElementById('board');
const traySlots = document.getElementById('traySlots');
const coach = document.getElementById('coach');

const state = {
    placed: new Map(),   // "x,y" -> pieceId
    pieces: new Map(),   // id -> { def, cells, anchor:{x,y}|null, el, slotEl }
    history: [],
    moves: 0,
    started: false,
    over: false,
};

/* ---------- 棋盘渲染 ---------- */
function buildBoard() {
    for (let x = -HALF; x < HALF; x++) {
        for (let y = -HALF; y < HALF; y++) {
            const d = document.createElement('div');
            // 仅四角铺斑马线纹理，作街区路口装饰
            const corner = (x === -HALF || x === HALF - 1) && (y === -HALF || y === HALF - 1);
            d.className = 'cell' + (corner ? ' corner' : '');
            d.dataset.x = x; d.dataset.y = y;
            positionAt(d, x, y);
            board.appendChild(d);
        }
    }
    // 小偷
    const t = document.createElement('div');
    t.className = 'thief'; t.id = 'thief';
    t.innerHTML = `
    <svg viewBox="0 0 52 52">
        <circle cx="26" cy="27" r="21" fill="#F04E45" stroke="#22315B" stroke-width="3.5"/>
        <rect x="10" y="20" width="32" height="13" rx="6.5" fill="#22315B"/>
        <g class="eyes">
            <circle cx="19.5" cy="26.5" r="4" fill="#fff"/><circle cx="32.5" cy="26.5" r="4" fill="#fff"/>
            <circle cx="19.5" cy="26.5" r="1.9" fill="#22315B"/><circle cx="32.5" cy="26.5" r="1.9" fill="#22315B"/>
        </g>
        <path d="M22 40 q4 3 8 0" stroke="#22315B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M14 12 q12 -9 24 0" stroke="#C9332B" stroke-width="4" fill="none" stroke-linecap="round"/>
    </svg>`;
    positionAt(t, THIEF.x, THIEF.y);
    board.appendChild(t);
}

/* 棋盘坐标 -> 像素（Y 轴向上，与 Cocos 一致） */
function positionAt(el, gx, gy) {
    const c = CELL();
    el.style.left = ((gx + HALF) * c) + 'px';
    el.style.top  = ((HALF - 1 - gy) * c) + 'px';
}
function pixelToGrid(px, py) {
    const c = CELL();
    // 以格中心为吸附点（与 BoardGrid.localToCell 的 -cellSize/2 对齐）
    return { x: Math.round((px - c / 2) / c) - HALF, y: HALF - 1 - Math.round((py - c / 2) / c) };
}

/* ---------- 棋子渲染 ---------- */
function buildTray() {
    PIECES.forEach((def) => {
        const slot = document.createElement('div');
        slot.className = 'slot';
        traySlots.appendChild(slot);

        const el = document.createElement('div');
        el.className = 'piece';
        el.dataset.id = def.id;
        const piece = { def, cells: def.cells.map(c => ({...c})), anchor: null, el, slotEl: slot, rot: 0 };
        state.pieces.set(def.id, piece);
        renderCells(piece);
        slot.appendChild(el);
        layoutInTray(piece);
        attachPointer(piece);
    });
}

function renderCells(piece) {
    piece.el.innerHTML = '';
    const c = CELL();
    const xs = piece.cells.map(c2 => c2.x), ys = piece.cells.map(c2 => c2.y);
    piece.minX = Math.min(...xs); piece.maxY = Math.max(...ys);
    piece.w = (Math.max(...xs) - piece.minX + 1) * c;
    piece.h = (Math.max(...ys) - Math.min(...ys) + 1) * c;
    piece.el.style.width = piece.w + 'px';
    piece.el.style.height = piece.h + 'px';
    piece.cells.forEach((cell, i) => {
        const d = document.createElement('div');
        d.className = 'pcell' + (i === piece.def.cop ? ' cop' : '');
        d.style.left = ((cell.x - piece.minX) * c) + 'px';
        d.style.top  = ((piece.maxY - cell.y) * c) + 'px';
        piece.el.appendChild(d);
    });
}

/* 托盘内等比缩小展示：以槽位中心为基准，避免依赖静态位置 */
function layoutInTray(piece) {
    const slot = piece.slotEl;
    const scale = Math.min(0.52, (slot.clientWidth - 18) / piece.w, (slot.clientHeight - 14) / piece.h);
    piece.el.style.position = 'absolute';
    piece.el.style.left = '50%';
    piece.el.style.top = '50%';
    piece.el.style.transform = `translate(-50%, -50%) scale(${scale})`;
}

/* ---------- 旋转（绕 origin 顺时针 90°，与 Rotation 定义一致） ---------- */
function rotated(piece) {
    const o = piece.cells[piece.def.origin];
    return piece.cells.map(c => ({ x: o.x - (c.y - o.y), y: o.y + (c.x - o.x) }));
}

/* ---------- 占用与合法性 ---------- */
function cellsOnBoard(piece, anchor, cells) {
    return cells.map(c => ({ x: anchor.x + (c.x - cells[piece.def.origin].x),
                             y: anchor.y + (c.y - cells[piece.def.origin].y) }));
}
function inBoard(g) { return g.x >= -HALF && g.x < HALF && g.y >= -HALF && g.y < HALF; }
function isFree(g) { return inBoard(g) && !state.placed.has(g.x + ',' + g.y) && !(g.x === THIEF.x && g.y === THIEF.y); }
function canPlace(piece, anchor, cells) { return cellsOnBoard(piece, anchor, cells).every(isFree); }

/* ---------- 拖拽交互：指针事件，触屏鼠标通用 ---------- */
let drag = null;
let ghostCells = [];

function attachPointer(piece) {
    piece.el.addEventListener('pointerdown', (e) => {
        if (state.over || !state.started) return;
        e.preventDefault();
        const wasPlaced = !!piece.anchor;
        const fromAnchor = piece.anchor ? { ...piece.anchor } : null;
        const fromCells = piece.cells.map(c => ({...c}));

        // 从棋盘上拿起：先释放占用
        if (wasPlaced) {
            cellsOnBoard(piece, piece.anchor, piece.cells).forEach(g => state.placed.delete(g.x + ',' + g.y));
        }

        piece.el.classList.add('dragging');
        piece.el.style.transform = 'scale(1)';
        piece.el.style.zIndex = 50;
        document.getElementById('stage').appendChild(piece.el);
        piece.el.style.position = 'fixed';

        drag = {
            piece, wasPlaced, fromAnchor, fromCells,
            moved: false,
            startX: e.clientX, startY: e.clientY,
            offX: piece.w / 2, offY: piece.h / 2,
        };
        moveDrag(e);
    });
}

// 全局监听 pointermove / pointerup，避免 setPointerCapture 在部分环境失效
document.addEventListener('pointermove', (e) => {
    if (!drag) return;
    if (Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) > 8) drag.moved = true;
    moveDrag(e);
});

document.addEventListener('pointerup', (e) => {
    if (!drag) return;
    const d = drag; drag = null;
    const piece = d.piece;
    clearGhost();
    piece.el.classList.remove('dragging');

    if (!d.moved) {
        // 点按：棋盘上转向；托盘里不响应
        if (d.wasPlaced) {
            tryRotate(piece, d.fromAnchor);
        } else {
            returnToTray(piece);
        }
        return;
    }
    dropPiece(piece, e, d);
});

function boardRect() { return board.getBoundingClientRect(); }

function moveDrag(e) {
    const { piece } = drag;
    piece.el.style.left = (e.clientX - drag.offX) + 'px';
    piece.el.style.top  = (e.clientY - drag.offY) + 'px';

    // 落点预览：以棋子 origin 格对齐最近棋盘格
    const r = boardRect();
    const c = CELL();
    const o = piece.cells[piece.def.origin];
    const px = e.clientX - r.left - drag.offX + (o.x - piece.minX + 0.5) * c;
    const py = e.clientY - r.top  - drag.offY + (piece.maxY - o.y + 0.5) * c;
    const anchor = pixelToGrid(px, py);
    drag.anchor = anchor;
    showGhost(piece, anchor);
}

function showGhost(piece, anchor) {
    clearGhost();
    const cells = cellsOnBoard(piece, anchor, piece.cells);
    const ok = canPlace(piece, anchor, piece.cells);
    cells.forEach(g => {
        if (!inBoard(g)) return;
        const d = document.createElement('div');
        d.className = 'ghost' + (ok ? '' : ' bad');
        positionAt(d, g.x, g.y);
        board.appendChild(d);
        ghostCells.push(d);
    });
}
function clearGhost() { ghostCells.forEach(d => d.remove()); ghostCells = []; }

function dropPiece(piece, e, d) {
    const anchor = d.anchor ?? (() => {
        const r = boardRect(); const c = CELL(); const o = piece.cells[piece.def.origin];
        return pixelToGrid(e.clientX - r.left - d.offX + (o.x - piece.minX + .5) * c,
                           e.clientY - r.top - d.offY + (piece.maxY - o.y + .5) * c);
    })();

    if (canPlace(piece, anchor, piece.cells)) {
        placePiece(piece, anchor);
        state.history.push({ piece, fromAnchor: d.fromAnchor, fromCells: d.fromCells });
        if (!d.wasPlaced) {
            state.moves++;
            document.getElementById('moveCount').textContent = state.moves;
        }
        updateUndo();
        checkWin();
    } else {
        // 非法落点：弹回原位
        piece.el.classList.add('shake');
        setTimeout(() => piece.el.classList.remove('shake'), 320);
        if (d.wasPlaced) {
            cellsOnBoard(piece, d.fromAnchor, piece.cells).forEach(g => state.placed.set(g.x + ',' + g.y, piece.def.id));
            snapToBoard(piece, d.fromAnchor);
        } else {
            returnToTray(piece);
        }
    }
}

function placePiece(piece, anchor) {
    piece.anchor = anchor;
    cellsOnBoard(piece, anchor, piece.cells).forEach(g => state.placed.set(g.x + ',' + g.y, piece.def.id));
    piece.slotEl.classList.add('empty');
    snapToBoard(piece, anchor);
    if (!coachShown) { coachShown = true; showCoach(piece); }
}

function snapToBoard(piece, anchor) {
    board.appendChild(piece.el);
    piece.el.style.position = 'absolute';
    piece.el.style.transform = 'scale(1)';
    piece.el.style.zIndex = 5;
    piece.el.classList.add('placed');
    const c = CELL();
    const o = piece.cells[piece.def.origin];
    const px = (anchor.x + HALF) * c - (o.x - piece.minX) * c;
    const py = (HALF - 1 - anchor.y) * c - (piece.maxY - o.y) * c;
    piece.el.style.left = px + 'px';
    piece.el.style.top = py + 'px';
}

function returnToTray(piece) {
    piece.anchor = null;
    piece.el.classList.remove('placed');
    piece.slotEl.classList.remove('empty');
    piece.slotEl.appendChild(piece.el);
    layoutInTray(piece);
}

/* ---------- 点按旋转 ---------- */
function tryRotate(piece, anchor) {
    const next = rotated(piece);
    if (canPlace(piece, anchor, next)) {
        piece.cells = next;
        renderCells(piece);
        snapToBoard(piece, anchor);
        cellsOnBoard(piece, anchor, next).forEach(g => state.placed.set(g.x + ',' + g.y, piece.def.id));
    } else {
        // 转不动：恢复占用并抖动提示
        cellsOnBoard(piece, anchor, piece.cells).forEach(g => state.placed.set(g.x + ',' + g.y, piece.def.id));
        snapToBoard(piece, anchor);
        piece.el.classList.add('shake');
        setTimeout(() => piece.el.classList.remove('shake'), 320);
    }
}

/* ---------- 胜负：小偷四邻全被封锁 ---------- */
function checkWin() {
    const dirs = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
    const escapes = dirs
        .map(d => ({ x: THIEF.x + d.x, y: THIEF.y + d.y }))
        .filter(inBoard);
    if (escapes.length && escapes.every(g => state.placed.has(g.x + ',' + g.y))) {
        state.over = true;
        document.getElementById('thief').classList.add('caught');
        const stars = state.moves <= 4 ? 3 : state.moves <= 5 ? 2 : 1;
        document.getElementById('winStars').innerHTML =
            '⭐'.repeat(stars) + `<span class="dim">${'⭐'.repeat(3 - stars)}</span>`;
        document.getElementById('winText').textContent =
            `只用 ${state.moves} 队警力就封锁了小镇，小偷插翅难逃！`;
        setTimeout(() => document.getElementById('winOverlay').classList.remove('hidden'), 650);
    }
}

/* ---------- 撤销 / 重开 ---------- */
function updateUndo() {
    document.getElementById('btnUndo').disabled = state.history.length === 0;
}
document.getElementById('btnUndo').addEventListener('click', () => {
    const last = state.history.pop();
    if (!last) return;
    const { piece } = last;
    cellsOnBoard(piece, piece.anchor, piece.cells).forEach(g => state.placed.delete(g.x + ',' + g.y));
    if (last.fromAnchor) {
        snapToBoard(piece, last.fromAnchor);
        piece.anchor = last.fromAnchor;
        cellsOnBoard(piece, piece.anchor, piece.cells).forEach(g => state.placed.set(g.x + ',' + g.y, piece.def.id));
    } else {
        state.moves--;
        document.getElementById('moveCount').textContent = state.moves;
        returnToTray(piece);
    }
    updateUndo();
});

function resetGame() {
    state.placed.clear();
    state.history = [];
    state.moves = 0;
    state.over = false;
    document.getElementById('moveCount').textContent = '0';
    document.getElementById('thief').classList.remove('caught');
    state.pieces.forEach(p => {
        p.cells = p.def.cells.map(c => ({...c}));
        renderCells(p);
        returnToTray(p);
    });
    updateUndo();
}
document.getElementById('btnRestart').addEventListener('click', resetGame);
document.getElementById('btnAgain').addEventListener('click', () => {
    document.getElementById('winOverlay').classList.add('hidden');
    resetGame();
});

/* ---------- 操作引导气泡 ---------- */
let coachShown = false;
function showCoach(piece) {
    const r = piece.el.getBoundingClientRect();
    const b = document.querySelector('.board-wrap').getBoundingClientRect();
    coach.style.left = Math.min(Math.max(r.left - b.left + r.width / 2 - 70, 0), b.width - 150) + 'px';
    coach.style.top = (r.top - b.top - 40) + 'px';
    coach.classList.add('show');
    setTimeout(() => coach.classList.remove('show'), 2200);
}

document.getElementById('btnStart').addEventListener('click', () => {
    document.getElementById('startOverlay').classList.add('hidden');
    state.started = true;
});

/* ---------- 初始化 ---------- */
buildBoard();
buildTray();
window.addEventListener('resize', () => {
    state.pieces.forEach(p => {
        renderCells(p);
        if (p.anchor) snapToBoard(p, p.anchor); else layoutInTray(p);
    });
    // 棋盘格与小偷重新定位
    document.querySelectorAll('.cell').forEach(d => positionAt(d, +d.dataset.x, +d.dataset.y));
    positionAt(document.getElementById('thief'), THIEF.x, THIEF.y);
});
</script>
</body>
</html>
